<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fde8f8" />
    <title>💖🍫🍫🍫💖</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #fde8f8;
        background-image: url("./IMG_4878.JPG");
        background-size: cover;
        background-position: center;
        font-family: "Hiragino Maru Gothic ProN", "Rounded M+ 1c", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      button {
        font-family: inherit;
      }

      #info {
        position: absolute;
        top: calc(20px + env(safe-area-inset-top));
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        text-align: center;
        color: #ff6699;
        font-weight: bold;
        font-size: 1.2rem;
        pointer-events: none;
        text-shadow: 2px 2px 0px #fff;
        z-index: 10;
      }

      /* ===== 上方：巧克力形狀與口味 ===== */
      #style-bar {
        position: absolute;
        top: calc(62px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
        touch-action: manipulation;
      }
      body.eat-mode #style-bar {
        display: none;
      }
      .seg {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.6);
        padding: 6px 12px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(255, 102, 153, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        font-weight: bold;
        font-size: 0.8rem;
        color: #ff6699;
        white-space: nowrap;
      }
      .chip {
        width: 34px;
        height: 34px;
        padding: 0;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #fff;
        color: #ff6699;
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
      }
      .chip.active {
        border-color: #ff6699;
        box-shadow: 0 0 8px #ff6699;
        transform: scale(1.08);
      }

      #ui-container {
        position: absolute;
        bottom: calc(30px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
        touch-action: manipulation;
      }

      #tools {
        display: flex;
        gap: 12px;
        align-items: center;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: auto;
        scrollbar-width: none;
        background: rgba(255, 255, 255, 0.6);
        padding: 15px 22px;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(255, 102, 153, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      #tools::-webkit-scrollbar {
        display: none;
      }
      .tool-divider {
        width: 2px;
        height: 30px;
        flex-shrink: 0;
        border-radius: 2px;
        background: rgba(255, 102, 153, 0.35);
      }

      .tool-btn {
        width: 45px;
        height: 45px;
        flex-shrink: 0;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid white;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s,
          border-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.3rem;
        color: #fff;
      }
      .tool-btn.active {
        border-color: #ff6699;
        transform: scale(1.1);
        box-shadow: 0 0 10px #ff6699;
      }
      .sprinkle-bar-btn {
        background: linear-gradient(
          45deg,
          #ffb3ba,
          #ffdfba,
          #baffc9,
          #bae1ff,
          #e0baff
        );
      }
      .sprinkle-jimmies-btn {
        background: repeating-linear-gradient(
          60deg,
          #ff4d6d 0 6px,
          #ffffff 6px 12px,
          #ff8fab 12px 18px
        );
      }
      .sprinkle-heart-btn {
        background-color: #ff85a1;
      }
      .sprinkle-choco-heart-btn {
        background-color: #fffdd0;
        color: #4a2e15;
      }
      .sprinkle-star-btn {
        background-color: #fdfd96;
      }
      .pearl-silver-btn {
        background: radial-gradient(
          circle at 35% 30%,
          #ffffff,
          #c8c8c8 45%,
          #8a8a8a
        );
      }
      .pearl-pink-btn {
        background: radial-gradient(
          circle at 35% 30%,
          #ffffff,
          #ff9ec4 45%,
          #e0628f
        );
      }

      #controls {
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.6);
        padding: 10px 25px;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(255, 102, 153, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        font-weight: bold;
        color: #ff6699;
      }
      .size-group {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      .action-btn {
        border: none;
        background: #ff6699;
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        white-space: nowrap;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .action-btn:active {
        transform: scale(0.95);
      }
      #eat-btn {
        background: #ffb7c5;
        color: #d11a2a;
        border: 2px solid #fff;
      }

      @media (hover: hover) {
        .tool-btn:hover,
        .chip:hover {
          transform: scale(1.15);
        }
        .action-btn:hover {
          background: #ff3377;
          transform: scale(1.05);
        }
        #eat-btn:hover {
          background: #ff9a9e;
        }
      }

      input[type="range"] {
        accent-color: #ff6699;
      }

      #oishii-msg {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 92vw;
        text-align: center;
        font-size: clamp(2rem, 9vw, 4rem);
        color: #ff3377;
        font-weight: bold;
        text-shadow:
          4px 4px 0px #fff,
          -2px -2px 0 #fff,
          2px -2px 0 #fff,
          -2px 2px 0 #fff;
        display: none;
        z-index: 20;
        pointer-events: none;
        animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -50%) scale(0);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* ===== 手機版面 ===== */
      @media (max-width: 600px) {
        #info {
          top: calc(12px + env(safe-area-inset-top));
          font-size: 1rem;
        }
        #style-bar {
          top: calc(44px + env(safe-area-inset-top));
          gap: 6px;
          max-width: calc(100% - 16px);
        }
        .seg {
          padding: 5px 8px;
          gap: 5px;
          font-size: 0.7rem;
        }
        .chip {
          width: 30px;
          height: 30px;
          font-size: 0.95rem;
        }
        #ui-container {
          bottom: calc(12px + env(safe-area-inset-bottom));
          width: calc(100% - 20px);
          gap: 8px;
        }
        #tools {
          gap: 9px;
          padding: 10px 14px;
          touch-action: pan-x;
        }
        .tool-btn {
          width: 40px;
          height: 40px;
          font-size: 1.15rem;
        }
        #controls {
          flex-wrap: wrap;
          gap: 8px 10px;
          padding: 10px 14px;
          border-radius: 24px;
          max-width: 100%;
          box-sizing: border-box;
          font-size: 0.9rem;
        }
        .size-group {
          width: 100%;
          justify-content: center;
        }
        .size-group input[type="range"] {
          flex: 1;
          max-width: 220px;
          height: 28px;
        }
        .action-btn {
          padding: 8px 12px;
          font-size: 0.9rem;
        }
      }
      @media (max-width: 370px) {
        .seg-label {
          display: none;
        }
        .tool-btn {
          width: 36px;
          height: 36px;
          font-size: 1rem;
        }
        .action-btn {
          padding: 7px 10px;
          font-size: 0.85rem;
        }
      }
      /* 手機橫放 */
      @media (max-height: 500px) and (orientation: landscape) {
        #info {
          top: 8px;
          font-size: 0.95rem;
        }
        #style-bar {
          top: calc(8px + env(safe-area-inset-top));
          left: calc(8px + env(safe-area-inset-left));
          transform: none;
          flex-direction: column;
          align-items: flex-start;
        }
        #ui-container {
          flex-direction: row;
          width: auto;
          max-width: calc(100% - 20px);
          bottom: calc(8px + env(safe-area-inset-bottom));
        }
        #tools {
          max-width: 50vw;
        }
        #controls {
          flex-wrap: nowrap;
        }
        .size-group {
          width: auto;
        }
        .size-group input[type="range"] {
          width: 80px;
        }
      }
    </style>

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="info">左鍵畫畫，右鍵旋轉視角 🎀</div>

    <div id="style-bar">
      <div class="seg">
        <span class="seg-label">カタチ</span>
        <button class="chip active" data-shape="round" title="圓形">●</button>
        <button class="chip" data-shape="heart" title="愛心">♥</button>
        <button class="chip" data-shape="flower" title="花朵">✿</button>
      </div>
      <div class="seg">
        <span class="seg-label">ベース</span>
        <button
          class="chip active"
          data-base="#3d1c04"
          style="background: #3d1c04"
          title="黑巧克力"
        ></button>
        <button
          class="chip"
          data-base="#7a4526"
          style="background: #7a4526"
          title="牛奶巧克力"
        ></button>
        <button
          class="chip"
          data-base="#f3e9cf"
          style="background: #f3e9cf"
          title="白巧克力"
        ></button>
        <button
          class="chip"
          data-base="#f5afc1"
          style="background: #f5afc1"
          title="草莓巧克力"
        ></button>
      </div>
    </div>

    <video
      id="webcam-video"
      autoplay
      playsinline
      muted
      style="display: none"
    ></video>

    <div id="oishii-msg">
      ごちそうさまでした！💖<br /><span style="font-size: 1.5rem"></span>
    </div>

    <div id="ui-container">
      <div id="controls">
        <div class="size-group">
          <label for="size-slider">太さ：</label>
          <input
            type="range"
            id="size-slider"
            min="0.05"
            max="0.4"
            step="0.05"
            value="0.15"
          />
        </div>
        <button id="undo-btn" class="action-btn">戻る ↶</button>
        <button id="clear-btn" class="action-btn">もう1コ作る ↺</button>
        <button id="eat-btn" class="action-btn">食べる！📸</button>
      </div>

      <div id="tools">
        <div
          class="tool-btn active"
          style="background-color: #4a2e15"
          data-tool="chocolate"
          data-color="#4a2e15"
          title="黑巧克力筆"
        ></div>
        <div
          class="tool-btn"
          style="background-color: #fffdd0"
          data-tool="chocolate"
          data-color="#fffdd0"
          title="白巧克力筆"
        ></div>
        <div
          class="tool-btn"
          style="background-color: #ffb7c5"
          data-tool="chocolate"
          data-color="#ffb7c5"
          title="草莓巧克力筆"
        ></div>
        <div class="tool-divider"></div>
        <div
          class="tool-btn pearl-silver-btn"
          data-tool="pearl-silver"
          title="銀色珍珠糖"
        ></div>
        <div
          class="tool-btn pearl-pink-btn"
          data-tool="pearl-pink"
          title="粉紅珍珠糖"
        ></div>
        <div
          class="tool-btn sprinkle-jimmies-btn"
          data-tool="sprinkle-jimmies"
          title="粉紅系彩色糖針"
        ></div>
        <div
          class="tool-btn sprinkle-bar-btn"
          data-tool="sprinkle-bar"
          title="馬卡龍色糖針"
        >
          ✧
        </div>
        <div
          class="tool-btn sprinkle-heart-btn"
          data-tool="sprinkle-heart"
          title="粉色愛心糖粒"
        >
          ♥
        </div>
        <div
          class="tool-btn sprinkle-choco-heart-btn"
          data-tool="sprinkle-choco-heart"
          title="巧克力愛心"
        >
          ♥
        </div>
        <div
          class="tool-btn sprinkle-star-btn"
          data-tool="sprinkle-star"
          title="白色星星糖粒"
        >
          ★
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

      const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
      const DRAW_HINT = isTouchDevice
        ? "單指畫畫，雙指旋轉／縮放 🎀"
        : "左鍵畫畫，右鍵旋轉視角 🎀";
      const EAT_HINT = isTouchDevice
        ? "對著鏡頭「啊～」張大嘴巴吃掉它！😋<br><small>（或點一下巧克力）</small>"
        : "對著螢幕「啊～」張大嘴巴吃掉它！😋<br><small>（或點一下巧克力）</small>";
      const infoEl = document.getElementById("info");
      const styleBar = document.getElementById("style-bar");
      const uiContainer = document.getElementById("ui-container");
      infoEl.innerHTML = DRAW_HINT;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        200,
      );

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      const canvas = renderer.domElement;

      // 讓錫箔杯與銀珠有真的金屬反光（只套在金屬材質上）
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envTex = pmrem.fromScene(
        new RoomEnvironment(renderer),
        0.04,
      ).texture;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 8;
      controls.maxDistance = 60;
      controls.maxPolarAngle = Math.PI / 2 - 0.1;
      controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE,
      };
      controls.touches = {
        ONE: null,
        TWO: THREE.TOUCH.DOLLY_ROTATE,
      };
      window.addEventListener("contextmenu", (e) => e.preventDefault());

      // ==========================================
      // 📱 鏡頭：避開上下的按鈕區，讓巧克力置中在空白處
      // ==========================================
      const DRAW_VIEW = new THREE.Vector3(0, 12, 12);
      const EAT_VIEW = new THREE.Vector3(0, 5, 15);
      const FIT_RADIUS = 6.3;
      const isShortLandscape = () =>
        window.matchMedia("(max-height: 500px) and (orientation: landscape)")
          .matches;

      function freeArea() {
        const H = window.innerHeight;
        let top = infoEl.getBoundingClientRect().bottom;
        const sb = styleBar.getBoundingClientRect();
        if (sb.height > 0 && !isShortLandscape())
          top = Math.max(top, sb.bottom);
        let bottom = uiContainer.getBoundingClientRect().top;
        if (bottom - top < H * 0.35) bottom = top + H * 0.35;
        return { top, bottom, H };
      }

      function updateViewOffset() {
        const W = window.innerWidth;
        const { top, bottom, H } = freeArea();
        let off = H / 2 - (top + bottom) / 2;
        off = THREE.MathUtils.clamp(off, -H * 0.25, H * 0.25);
        camera.setViewOffset(W, H, 0, off, W, H);
        camera.updateProjectionMatrix();
      }

      function minFitDistance() {
        const { top, bottom, H } = freeArea();
        const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
        const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
        const halfVFree = Math.atan(Math.tan(halfV) * ((bottom - top) / H));
        return Math.max(
          FIT_RADIUS / Math.sin(halfH),
          (FIT_RADIUS * 0.75) / Math.sin(halfVFree),
        );
      }

      function setView(base) {
        updateViewOffset();
        const dist = Math.max(base.length(), minFitDistance());
        camera.position.copy(base).setLength(dist);
        controls.target.set(0, 0, 0);
        controls.maxDistance = Math.max(60, dist * 1.5);
        controls.update();
      }

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 50;
      dirLight.shadow.bias = -0.001;
      scene.add(dirLight);

      const masterGroup = new THREE.Group();
      scene.add(masterGroup);

      // ==========================================
      // 🌟 真實 3D 咬痕 Shader
      // ==========================================
      const biteUniforms = {
        biteData: {
          value: [
            new THREE.Vector4(3.5, 0.5, 3.5, 3.5),
            new THREE.Vector4(-3.5, 0.5, 3.5, 3.5),
            new THREE.Vector4(3.5, 0.5, -3.5, 3.5),
            new THREE.Vector4(-3.5, 0.5, -3.5, 3.5),
            new THREE.Vector4(0.0, 0.0, 0.0, 8.0),
          ],
        },
        numBites: { value: 0 },
      };

      function patchMaterialForBites(mat) {
        mat.side = THREE.DoubleSide;
        mat.onBeforeCompile = (shader) => {
          shader.uniforms.biteData = biteUniforms.biteData;
          shader.uniforms.numBites = biteUniforms.numBites;
          shader.vertexShader =
            `varying vec3 vWorldPosBite;\n` + shader.vertexShader;
          shader.vertexShader = shader.vertexShader.replace(
            "#include <worldpos_vertex>",
            `#include <worldpos_vertex>
             vWorldPosBite = (modelMatrix * vec4(transformed, 1.0)).xyz;`,
          );
          shader.fragmentShader =
            `uniform vec4 biteData[5];
             uniform int numBites;
             varying vec3 vWorldPosBite;\n` + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace(
            "void main() {",
            `void main() {
               for(int i=0; i<5; i++) {
                 if(i >= numBites) break;
                 if(distance(vWorldPosBite, biteData[i].xyz) < biteData[i].w) discard;
               }`,
          );
        };
        mat.needsUpdate = true;
      }

      // ==========================================
      // 材質
      // ==========================================
      const baseMat = new THREE.MeshStandardMaterial({
        color: "#3d1c04",
        roughness: 0.4,
      });
      const foilMat = new THREE.MeshStandardMaterial({
        color: "#dedede",
        metalness: 1.0,
        roughness: 0.3,
        envMap: envTex,
      });
      const frostingMaterials = {
        "#4a2e15": new THREE.MeshPhongMaterial({
          color: "#4a2e15",
          shininess: 15,
          specular: 0x222222,
        }),
        "#fffdd0": new THREE.MeshPhongMaterial({
          color: "#fffdd0",
          shininess: 20,
          specular: 0x888888,
        }),
        "#ffb7c5": new THREE.MeshPhongMaterial({
          color: "#ffb7c5",
          shininess: 20,
          specular: 0x888888,
        }),
      };
      const starMat = new THREE.MeshPhongMaterial({
        color: "#fffdd0",
        shininess: 10,
        specular: 0xaaaaaa,
      });
      const heartMat = new THREE.MeshPhongMaterial({
        color: "#ff85a1",
        shininess: 10,
        specular: 0xaaaaaa,
      });
      const chocoHeartMat = new THREE.MeshPhongMaterial({
        color: "#4a2e15",
        shininess: 25,
        specular: 0x333333,
      });
      const silverPearlMat = new THREE.MeshStandardMaterial({
        color: "#f2f2f2",
        metalness: 1.0,
        roughness: 0.12,
        envMap: envTex,
      });
      const pinkPearlMat = new THREE.MeshPhongMaterial({
        color: "#ff9ec4",
        shininess: 90,
        specular: 0xffffff,
      });
      const makeMats = (colors) =>
        colors.map(
          (c) =>
            new THREE.MeshPhongMaterial({
              color: c,
              shininess: 10,
              specular: 0xaaaaaa,
            }),
        );
      const barSprinkleMats = makeMats([
        "#ffb3ba",
        "#ffdfba",
        "#baffc9",
        "#bae1ff",
        "#e0baff",
        "#ffffff",
      ]);
      const jimmyMats = makeMats([
        "#ff4d6d",
        "#ff8fab",
        "#ffffff",
        "#c9184a",
        "#ffc2d1",
      ]);

      [
        baseMat,
        foilMat,
        starMat,
        heartMat,
        chocoHeartMat,
        silverPearlMat,
        pinkPearlMat,
        ...barSprinkleMats,
        ...jimmyMats,
        ...Object.values(frostingMaterials),
      ].forEach(patchMaterialForBites);

      // ==========================================
      // 🍫 巧克力形狀：圓形 / 愛心 / 花朵
      // ==========================================
      const OUTLINE_SAMPLES = 240;

      function outlinePoints(kind) {
        const pts = [];
        for (let i = 0; i < OUTLINE_SAMPLES; i++) {
          const t = (i / OUTLINE_SAMPLES) * Math.PI * 2;
          let x, y;
          if (kind === "heart") {
            const s = 0.31;
            x = 16 * Math.pow(Math.sin(t), 3) * s;
            y =
              (13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t) +
                2.5) *
              s;
          } else if (kind === "flower") {
            const r = 4.3 + 0.4 * Math.cos(6 * t);
            x = r * Math.cos(t);
            y = r * Math.sin(t);
          } else {
            x = 4.68 * Math.cos(t);
            y = 4.68 * Math.sin(t);
          }
          pts.push(new THREE.Vector2(x, y));
        }
        if (THREE.ShapeUtils.isClockWise(pts)) pts.reverse();
        return pts;
      }

      // 每個點往外的方向（平滑過，愛心的凹口才不會打結）
      function outlineNormals(outline) {
        const N = outline.length;
        const raw = outline.map((p, i) => {
          const a = outline[(i - 1 + N) % N];
          const b = outline[(i + 1) % N];
          return new THREE.Vector2(b.y - a.y, -(b.x - a.x)).normalize();
        });
        return raw.map((_, i) => {
          const s = new THREE.Vector2();
          for (let k = -6; k <= 6; k++) s.add(raw[(i + k + N) % N]);
          return s.normalize();
        });
      }

      function buildBaseGeometry(outline) {
        const shape = new THREE.Shape(outline);
        let g = new THREE.ExtrudeGeometry(shape, {
          depth: 1.2,
          bevelEnabled: true,
          bevelThickness: 0.15,
          bevelSize: 0.12,
          bevelSegments: 4,
          curveSegments: 1,
        });
        g.rotateX(-Math.PI / 2);
        g.translate(0, -0.6, 0); // 頂面在 y = 0.75
        g.deleteAttribute("uv");
        g.deleteAttribute("normal");
        g = mergeVertices(g, 1e-4);
        g.computeVertexNormals();
        return g;
      }

      // 依照輪廓做出有皺褶的錫箔杯
      function buildCupGeometry(outline) {
        const N = outline.length;
        const normals = outlineNormals(outline);
        const arc = [0];
        let perimeter = 0;
        for (let i = 1; i <= N; i++) {
          perimeter += outline[i % N].distanceTo(outline[i - 1]);
          arc.push(perimeter);
        }
        const pleats = Math.round(perimeter / 0.65);
        const ROWS = 5;
        const positions = [];
        for (let r = 0; r <= ROWS; r++) {
          const h = r / ROWS;
          const y = -0.85 + 1.7 * h;
          const offset = 0.17 + 0.65 * h; // 底部貼著巧克力，上緣往外翻
          for (let i = 0; i < N; i++) {
            const phase = (arc[i] / perimeter) * pleats * Math.PI * 2;
            const crinkle = Math.sin(phase) * 0.15 * (0.1 + 0.9 * h);
            const d = offset + crinkle;
            const p = outline[i];
            const n = normals[i];
            positions.push(p.x + n.x * d, y, -(p.y + n.y * d));
          }
        }
        const index = [];
        for (let r = 0; r < ROWS; r++) {
          for (let i = 0; i < N; i++) {
            const a = r * N + i;
            const b = r * N + ((i + 1) % N);
            const c = (r + 1) * N + i;
            const d = (r + 1) * N + ((i + 1) % N);
            index.push(a, b, d, a, d, c);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3),
        );
        g.setIndex(index);
        g.computeVertexNormals();
        return g;
      }

      function buildCupBottom(outline) {
        const normals = outlineNormals(outline);
        const pts = outline.map(
          (p, i) =>
            new THREE.Vector2(
              p.x + normals[i].x * 0.17,
              p.y + normals[i].y * 0.17,
            ),
        );
        const g = new THREE.ShapeGeometry(new THREE.Shape(pts));
        g.rotateX(-Math.PI / 2);
        g.translate(0, -0.85, 0);
        return g;
      }

      const baseChocolate = new THREE.Mesh(new THREE.BufferGeometry(), baseMat);
      baseChocolate.receiveShadow = true;
      baseChocolate.castShadow = true;
      masterGroup.add(baseChocolate);

      const foilGroup = new THREE.Group();
      const cupMesh = new THREE.Mesh(new THREE.BufferGeometry(), foilMat);
      const bottomMesh = new THREE.Mesh(new THREE.BufferGeometry(), foilMat);
      cupMesh.castShadow = true;
      cupMesh.receiveShadow = true;
      bottomMesh.receiveShadow = true;
      foilGroup.add(cupMesh);
      foilGroup.add(bottomMesh);
      foilGroup.position.y = 0.09;
      masterGroup.add(foilGroup);

      function buildBase(kind) {
        const outline = outlinePoints(kind);
        baseChocolate.geometry.dispose();
        cupMesh.geometry.dispose();
        bottomMesh.geometry.dispose();
        baseChocolate.geometry = buildBaseGeometry(outline);
        cupMesh.geometry = buildCupGeometry(outline);
        bottomMesh.geometry = buildCupBottom(outline);
      }
      buildBase("round");

      const chocolateGroup = new THREE.Group();
      masterGroup.add(chocolateGroup);
      const sprinkleGroup = new THREE.Group();
      masterGroup.add(sprinkleGroup);

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // ==========================================
      // 裝飾糖的形狀
      // ==========================================
      const sprinkleExtrudeSettings = {
        depth: 0.04,
        bevelEnabled: true,
        bevelThickness: 0.01,
        bevelSize: 0.01,
        bevelSegments: 3,
      };
      function centerGeo(geo) {
        geo.computeBoundingBox();
        const c = new THREE.Vector3();
        geo.boundingBox.getCenter(c);
        geo.translate(-c.x, -c.y, -c.z);
        return geo;
      }
      function createStarGeometry() {
        const shape = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const radius = i % 2 === 0 ? 0.4 : 0.16;
          const angle = (i / 10) * Math.PI * 2;
          if (i === 0)
            shape.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
          else shape.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        shape.closePath();
        return centerGeo(
          new THREE.ExtrudeGeometry(shape, sprinkleExtrudeSettings),
        );
      }
      function createHeartGeometry() {
        const pts = [];
        for (let i = 0; i < 64; i++) {
          const t = (i / 64) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);
          pts.push(new THREE.Vector2(x / 40, y / 40));
        }
        const geo = new THREE.ExtrudeGeometry(
          new THREE.Shape(pts),
          sprinkleExtrudeSettings,
        );
        geo.scale(1.05, 1.05, 1);
        return centerGeo(geo);
      }
      const starGeo = createStarGeometry();
      const heartGeo = createHeartGeometry();
      const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
      const pearlGeo = new THREE.SphereGeometry(0.13, 16, 12);

      // 每種裝飾的撒法
      const SPRINKLES = {
        "sprinkle-bar": {
          geo: barGeo,
          mats: barSprinkleMats,
          count: [2, 4],
          spread: 0.6,
          safe: 0.15,
          lift: 0.08,
          lying: true,
          drag: [0.04, 0.1],
        },
        "sprinkle-jimmies": {
          geo: barGeo,
          mats: jimmyMats,
          count: [2, 4],
          spread: 0.6,
          safe: 0.15,
          lift: 0.08,
          lying: true,
          drag: [0.04, 0.1],
        },
        "sprinkle-heart": {
          geo: heartGeo,
          mats: [heartMat],
          count: [1, 1],
          spread: 0.3,
          safe: 0.4,
          lift: 0.03,
          drag: [0.15, 0.6],
        },
        "sprinkle-choco-heart": {
          geo: heartGeo,
          mats: [chocoHeartMat],
          count: [1, 1],
          spread: 0.2,
          safe: 0.5,
          lift: 0.03,
          scale: [1.3, 1.3],
          drag: [0.2, 0.6],
        },
        "sprinkle-star": {
          geo: starGeo,
          mats: [starMat],
          count: [1, 1],
          spread: 0.3,
          safe: 0.4,
          lift: 0.03,
          drag: [0.15, 0.6],
        },
        "pearl-silver": {
          geo: pearlGeo,
          mats: [silverPearlMat],
          count: [1, 1],
          spread: 0.15,
          safe: 0.27,
          lift: 0.1,
          scale: [0.8, 1.25],
          drag: [0.12, 0.4],
        },
        "pearl-pink": {
          geo: pearlGeo,
          mats: [pinkPearlMat],
          count: [1, 1],
          spread: 0.15,
          safe: 0.27,
          lift: 0.1,
          scale: [0.8, 1.25],
          drag: [0.12, 0.4],
        },
      };

      let isDrawing = false;
      let currentTool = "chocolate";
      let currentColor = "#4a2e15";
      let currentPoints = [];
      let currentLineMesh = null;
      let smoothPoint = null;
      let strokeLayer = 0;
      let TUBE_RADIUS = parseFloat(
        document.getElementById("size-slider").value,
      );

      let capGeo = new THREE.SphereGeometry(TUBE_RADIUS, 20, 16);
      let currentEndCap = null;
      let actionHistory = [];
      let currentActionMeshes = [];

      let isEatMode = false;
      let bitesTaken = 0;
      let isMouthCurrentlyOpen = false;

      document.getElementById("size-slider").addEventListener("input", (e) => {
        TUBE_RADIUS = parseFloat(e.target.value);
        capGeo = new THREE.SphereGeometry(TUBE_RADIUS, 20, 16);
      });

      // 巧克力筆只貼著巧克力表面畫（不會爬到別的線上面，重疊時才會平順）
      // 糖粒則可以落在畫好的線上
      function getIntersectData(event, includeStrokes) {
        if (isEatMode) return null;
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const targets = includeStrokes
          ? [baseChocolate, ...chocolateGroup.children]
          : [baseChocolate];
        const intersects = raycaster.intersectObjects(targets, false);
        const validHit = intersects.find(
          (hit) => !currentActionMeshes.includes(hit.object),
        );
        if (validHit)
          return { point: validHit.point, normal: validHit.face.normal };
        return null;
      }

      function scatterSprinkles(hitData) {
        const cfg = SPRINKLES[currentTool];
        if (!cfg) return;
        const count =
          cfg.count[0] +
          Math.floor(Math.random() * (cfg.count[1] - cfg.count[0] + 1));

        for (let i = 0; i < count; i++) {
          const s = cfg.scale
            ? THREE.MathUtils.lerp(cfg.scale[0], cfg.scale[1], Math.random())
            : 1;
          const proposedPos = hitData.point.clone();
          proposedPos.x += (Math.random() - 0.5) * cfg.spread;
          proposedPos.z += (Math.random() - 0.5) * cfg.spread;
          proposedPos.add(
            hitData.normal.clone().multiplyScalar(cfg.lift * s * 0.95),
          );

          let isOverlapping = false;
          for (const other of sprinkleGroup.children) {
            if (other.position.distanceTo(proposedPos) < cfg.safe * s) {
              isOverlapping = true;
              break;
            }
          }
          if (isOverlapping) continue;

          const mat = cfg.mats[Math.floor(Math.random() * cfg.mats.length)];
          const sprinkle = new THREE.Mesh(cfg.geo, mat);
          sprinkle.scale.setScalar(s);
          sprinkle.position.copy(proposedPos);
          sprinkle.lookAt(sprinkle.position.clone().add(hitData.normal));
          if (cfg.lying) sprinkle.rotateX(Math.PI / 2);
          sprinkle.rotateZ(Math.random() * Math.PI * 2);
          sprinkle.castShadow = true;
          sprinkle.receiveShadow = false;
          sprinkleGroup.add(sprinkle);
          currentActionMeshes.push(sprinkle);
        }
      }

      function strokePoint(hitData) {
        // 每一筆比上一筆高一點點，交叉時新的線會乾淨地疊在上面
        const lift = Math.min(strokeLayer * 0.004, 0.2);
        return hitData.point
          .clone()
          .add(hitData.normal.clone().multiplyScalar(TUBE_RADIUS * 0.7 + lift));
      }

      function makeCap(pos) {
        const cap = new THREE.Mesh(capGeo, frostingMaterials[currentColor]);
        cap.position.copy(pos);
        cap.castShadow = true;
        chocolateGroup.add(cap);
        currentActionMeshes.push(cap);
        return cap;
      }

      function rebuildTube() {
        const curve = new THREE.CatmullRomCurve3(
          currentPoints,
          false,
          "centripetal",
          0.5,
        );
        const segs = Math.min(1200, Math.max(24, currentPoints.length * 5));
        const g = new THREE.TubeGeometry(curve, segs, TUBE_RADIUS, 16, false);
        currentLineMesh.geometry.dispose();
        currentLineMesh.geometry = g;
      }

      function startDrawing(event) {
        if (isEatMode) return;
        const isSprinkle = currentTool !== "chocolate";
        const hitData = getIntersectData(event, isSprinkle);
        if (!hitData) return;
        isDrawing = true;
        currentActionMeshes = [];

        if (isSprinkle) {
          currentPoints = [hitData.point.clone()];
          scatterSprinkles(hitData);
          return;
        }

        strokeLayer++;
        const point = strokePoint(hitData);
        smoothPoint = point.clone();
        currentPoints = [
          point,
          point.clone().add(new THREE.Vector3(0.005, 0, 0.005)),
        ];
        currentLineMesh = new THREE.Mesh(
          new THREE.BufferGeometry(),
          frostingMaterials[currentColor],
        );
        currentLineMesh.castShadow = true;
        chocolateGroup.add(currentLineMesh);
        currentActionMeshes.push(currentLineMesh);
        rebuildTube();
        makeCap(currentPoints[0]);
        currentEndCap = makeCap(currentPoints[1]);
      }

      function draw(event) {
        if (!isDrawing || isEatMode) return;
        if (event.pointerType === "mouse" && (event.buttons & 1) === 0) return;
        const isSprinkle = currentTool !== "chocolate";
        const hitData = getIntersectData(event, isSprinkle);
        if (!hitData) return;

        if (isSprinkle) {
          const cfg = SPRINKLES[currentTool];
          const lastPoint = currentPoints[currentPoints.length - 1];
          if (
            lastPoint.distanceTo(hitData.point) > cfg.drag[0] &&
            Math.random() > cfg.drag[1]
          ) {
            currentPoints.push(hitData.point.clone());
            scatterSprinkles(hitData);
          }
          return;
        }

        if (!currentLineMesh) return;
        // 手指抖動平滑化
        smoothPoint.lerp(strokePoint(hitData), 0.5);
        const lastPoint = currentPoints[currentPoints.length - 1];
        const minDist = Math.max(0.08, TUBE_RADIUS * 0.5);
        if (lastPoint.distanceTo(smoothPoint) > minDist) {
          currentPoints.push(smoothPoint.clone());
          rebuildTube();
          currentEndCap.position.copy(smoothPoint);
        }
      }

      function resetStrokeState() {
        isDrawing = false;
        currentLineMesh = null;
        currentPoints = [];
        currentEndCap = null;
        smoothPoint = null;
        currentActionMeshes = [];
      }

      function stopDrawing() {
        if (isDrawing && currentActionMeshes.length > 0)
          actionHistory.push(currentActionMeshes);
        resetStrokeState();
      }

      function cancelStroke() {
        if (!isDrawing) return;
        if (currentLineMesh) currentLineMesh.geometry.dispose();
        currentActionMeshes.forEach((mesh) => {
          if (mesh.parent) mesh.parent.remove(mesh);
        });
        resetStrokeState();
      }

      // ==========================================
      // Pointer Events（滑鼠 + 觸控）
      // ==========================================
      const activePointers = new Set();
      let drawingPointerId = null;

      canvas.addEventListener("pointerdown", (e) => {
        activePointers.add(e.pointerId);
        if (isEatMode) {
          if (activePointers.size === 1 && e.button === 0) takeABite();
          return;
        }
        if (activePointers.size > 1) {
          cancelStroke();
          drawingPointerId = null;
          return;
        }
        if (e.button !== 0) return;
        startDrawing(e);
        if (isDrawing) drawingPointerId = e.pointerId;
      });

      canvas.addEventListener("pointermove", (e) => {
        if (e.pointerId !== drawingPointerId) return;
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        if (events.length > 1) events.forEach((ce) => draw(ce));
        else draw(e);
      });

      const endPointer = (e) => {
        activePointers.delete(e.pointerId);
        if (e.pointerId === drawingPointerId) {
          stopDrawing();
          drawingPointerId = null;
        }
      };
      window.addEventListener("pointerup", endPointer);
      window.addEventListener("pointercancel", endPointer);

      // ==========================================
      // 按鈕
      // ==========================================
      const toolButtons = document.querySelectorAll(".tool-btn");
      toolButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          toolButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentTool = btn.dataset.tool;
          if (currentTool === "chocolate") currentColor = btn.dataset.color;
        });
      });

      function bindChips(selector, onPick) {
        const chips = document.querySelectorAll(selector);
        chips.forEach((chip) =>
          chip.addEventListener("click", () => {
            chips.forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            onPick(chip);
          }),
        );
      }
      bindChips("[data-shape]", (chip) => buildBase(chip.dataset.shape));
      bindChips("[data-base]", (chip) => baseMat.color.set(chip.dataset.base));

      document.getElementById("undo-btn").addEventListener("click", () => {
        if (actionHistory.length === 0) return;
        const lastAction = actionHistory.pop();
        lastAction.forEach((mesh) => {
          if (mesh.geometry && mesh.geometry.type === "TubeGeometry")
            mesh.geometry.dispose();
          if (mesh.parent) mesh.parent.remove(mesh);
        });
      });

      document.getElementById("clear-btn").addEventListener("click", () => {
        [chocolateGroup, sprinkleGroup].forEach((group) => {
          for (let i = group.children.length - 1; i >= 0; i--) {
            const child = group.children[i];
            if (child.geometry && child.geometry.type === "TubeGeometry")
              child.geometry.dispose();
            group.remove(child);
          }
        });
        actionHistory = [];
        strokeLayer = 0;
        bitesTaken = 0;
        biteUniforms.numBites.value = 0;
        masterGroup.visible = true;
        masterGroup.position.set(0, 0, 0);
        masterGroup.rotation.set(0, 0, 0);
        document.getElementById("oishii-msg").style.display = "none";
        infoEl.innerHTML = isEatMode ? EAT_HINT : DRAW_HINT;
        masterGroup.traverse((child) => {
          if (child.isMesh) child.castShadow = true;
        });
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateViewOffset();
        const need = Math.max(minFitDistance(), controls.minDistance);
        const offset = camera.position.clone().sub(controls.target);
        if (offset.length() < need) {
          offset.setLength(need);
          camera.position.copy(controls.target).add(offset);
        }
        controls.maxDistance = Math.max(60, need * 1.5);
      });

      camera.aspect = window.innerWidth / window.innerHeight;
      setView(DRAW_VIEW);

      // ==========================================
      // 攝影機與張嘴吃掉
      // ==========================================
      const videoElement = document.getElementById("webcam-video");
      const eatBtn = document.getElementById("eat-btn");
      let faceMesh;
      let cameraInit = false;

      function initCamera() {
        cameraInit = true;
        if (!navigator.mediaDevices || !window.isSecureContext) {
          infoEl.innerHTML =
            "這個網址開不了鏡頭（需要 https）<br><small>點一下巧克力來吃吧！😋</small>";
          return;
        }
        try {
          faceMesh = new FaceMesh({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
          });
          faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
          faceMesh.onResults(onFaceResults);
          const cam = new Camera(videoElement, {
            onFrame: async () => {
              if (isEatMode) await faceMesh.send({ image: videoElement });
            },
            width: 320,
            height: 240,
            facingMode: "user",
          });
          cam.start().catch(() => {
            infoEl.innerHTML =
              "沒有拿到鏡頭權限<br><small>點一下巧克力來吃吧！😋</small>";
          });
        } catch (err) {
          infoEl.innerHTML =
            "鏡頭啟動失敗<br><small>點一下巧克力來吃吧！😋</small>";
        }
      }

      function takeABite() {
        if (bitesTaken >= 5) return;
        bitesTaken++;
        if (navigator.vibrate) navigator.vibrate(40);
        biteUniforms.numBites.value = bitesTaken;
        masterGroup.position.y -= 0.1;
        masterGroup.rotation.y += (Math.random() - 0.5) * 0.4;
        masterGroup.rotation.z += (Math.random() - 0.5) * 0.2;
        masterGroup.traverse((child) => {
          if (child.isMesh) child.castShadow = false;
        });
        if (bitesTaken >= 5) {
          masterGroup.visible = false;
          document.getElementById("oishii-msg").style.display = "block";
          infoEl.innerHTML = "按「もう1コ作る ↺」再來一顆！🎀";
        }
      }

      function onFaceResults(results) {
        if (!isEatMode) return;
        if (
          results.multiFaceLandmarks &&
          results.multiFaceLandmarks.length > 0
        ) {
          const lm = results.multiFaceLandmarks[0];
          const faceHeight = Math.abs(lm[152].y - lm[10].y) || 1;
          const mouthRatio = Math.abs(lm[13].y - lm[14].y) / faceHeight;
          if (mouthRatio > 0.1 && !isMouthCurrentlyOpen) {
            isMouthCurrentlyOpen = true;
            takeABite();
          } else if (mouthRatio < 0.07) {
            isMouthCurrentlyOpen = false;
          }
        }
      }

      eatBtn.addEventListener("click", () => {
        isEatMode = !isEatMode;
        cancelStroke();
        document.body.classList.toggle("eat-mode", isEatMode);
        if (isEatMode) {
          infoEl.innerHTML = EAT_HINT;
          eatBtn.innerHTML = "畫畫モード 🖌️";
          setView(EAT_VIEW);
          if (!cameraInit) initCamera();
        } else {
          infoEl.innerHTML = DRAW_HINT;
          eatBtn.innerHTML = "食べる！📸";
          setView(DRAW_VIEW);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
