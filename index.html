<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fde8f8" />
    <title>💖🍫🍫🍫💖</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #fde8f8;
        background-image: url("./IMG_4878.JPG");
        background-size: cover;
        background-position: center;
        font-family: "Hiragino Maru Gothic ProN", "Rounded M+ 1c", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        touch-action: none; /* 畫布上的手勢全部交給程式處理 */
      }

      #info {
        position: absolute;
        top: calc(20px + env(safe-area-inset-top));
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        text-align: center;
        color: #ff6699;
        font-weight: bold;
        font-size: 1.2rem;
        pointer-events: none;
        text-shadow: 2px 2px 0px #fff;
        z-index: 10;
      }

      #ui-container {
        position: absolute;
        bottom: calc(30px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
        touch-action: manipulation;
      }

      #tools {
        display: flex;
        gap: 15px;
        align-items: center;
        background: rgba(255, 255, 255, 0.6);
        padding: 15px 25px;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(255, 102, 153, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }

      .tool-btn {
        width: 45px;
        height: 45px;
        flex-shrink: 0;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid white;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s,
          border-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
        color: #fff;
      }
      .tool-btn.active {
        border-color: #ff6699;
        transform: scale(1.1);
        box-shadow: 0 0 10px #ff6699;
      }

      .sprinkle-bar-btn {
        background: linear-gradient(
          45deg,
          #ffb3ba,
          #ffdfba,
          #baffc9,
          #bae1ff,
          #e0baff
        );
        font-size: 1.4rem;
      }
      .sprinkle-heart-btn {
        background-color: #ff85a1;
        font-size: 1.4rem;
      }
      .sprinkle-star-btn {
        background-color: #fdfd96;
        font-size: 1.4rem;
      }

      #controls {
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.6);
        padding: 10px 25px;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(255, 102, 153, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        font-weight: bold;
        color: #ff6699;
      }
      .size-group {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      .action-btn {
        border: none;
        background: #ff6699;
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        white-space: nowrap;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition:
          background 0.2s,
          transform 0.2s;
        font-family: inherit;
      }
      .action-btn:active {
        transform: scale(0.95);
      }

      #eat-btn {
        background: #ffb7c5;
        color: #d11a2a;
        border: 2px solid #fff;
      }

      /* 只有真的有滑鼠的裝置才做 hover 效果，避免手機上按鈕卡在放大狀態 */
      @media (hover: hover) {
        .tool-btn:hover {
          transform: scale(1.15);
        }
        .action-btn:hover {
          background: #ff3377;
          transform: scale(1.05);
        }
        #eat-btn:hover {
          background: #ff9a9e;
        }
      }

      input[type="range"] {
        accent-color: #ff6699;
      }

      #oishii-msg {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 92vw;
        text-align: center;
        font-size: clamp(2rem, 9vw, 4rem);
        color: #ff3377;
        font-weight: bold;
        text-shadow:
          4px 4px 0px #fff,
          -2px -2px 0 #fff,
          2px -2px 0 #fff,
          -2px 2px 0 #fff;
        display: none;
        z-index: 20;
        pointer-events: none;
        animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -50%) scale(0);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* ===== 手機版面 ===== */
      @media (max-width: 600px) {
        #info {
          top: calc(12px + env(safe-area-inset-top));
          font-size: 1rem;
        }
        #ui-container {
          bottom: calc(12px + env(safe-area-inset-bottom));
          width: calc(100% - 20px);
          gap: 8px;
        }
        #tools {
          gap: 8px;
          padding: 10px 14px;
          max-width: 100%;
          box-sizing: border-box;
        }
        .tool-btn {
          width: 40px;
          height: 40px;
          font-size: 1.2rem;
        }
        #controls {
          flex-wrap: wrap;
          gap: 8px 10px;
          padding: 10px 14px;
          border-radius: 24px;
          max-width: 100%;
          box-sizing: border-box;
          font-size: 0.9rem;
        }
        .size-group {
          width: 100%;
          justify-content: center;
        }
        .size-group input[type="range"] {
          flex: 1;
          max-width: 220px;
          height: 28px;
        }
        .action-btn {
          padding: 8px 12px;
          font-size: 0.9rem;
        }
      }
      @media (max-width: 360px) {
        .tool-btn {
          width: 36px;
          height: 36px;
          font-size: 1rem;
        }
        #tools {
          gap: 6px;
          padding: 8px 10px;
        }
        .action-btn {
          padding: 7px 10px;
          font-size: 0.85rem;
        }
      }
      /* 手機橫放：高度很矮，把兩排工具並排 */
      @media (max-height: 500px) and (orientation: landscape) {
        #ui-container {
          flex-direction: row;
          width: auto;
          bottom: calc(8px + env(safe-area-inset-bottom));
        }
        #info {
          top: 8px;
          font-size: 0.95rem;
        }
        #controls {
          flex-wrap: nowrap;
        }
        .size-group {
          width: auto;
        }
        .size-group input[type="range"] {
          width: 90px;
        }
      }
    </style>

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="info">左鍵畫畫，右鍵旋轉視角 🎀</div>

    <video
      id="webcam-video"
      autoplay
      playsinline
      muted
      style="display: none"
    ></video>

    <div id="oishii-msg">
      ごちそうさまでした！💖<br /><span style="font-size: 1.5rem"></span>
    </div>

    <div id="ui-container">
      <div id="controls">
        <div class="size-group">
          <label for="size-slider">太さ：</label>
          <input
            type="range"
            id="size-slider"
            min="0.05"
            max="0.4"
            step="0.05"
            value="0.2"
          />
        </div>
        <button id="undo-btn" class="action-btn">戻る ↶</button>
        <button id="clear-btn" class="action-btn">もう1コ作る ↺</button>
        <button id="eat-btn" class="action-btn">食べる！📸</button>
      </div>

      <div id="tools">
        <div
          class="tool-btn active"
          style="background-color: #4a2e15"
          data-tool="chocolate"
          data-color="#4a2e15"
          title="黑巧克力"
        ></div>
        <div
          class="tool-btn"
          style="background-color: #fffdd0"
          data-tool="chocolate"
          data-color="#fffdd0"
          title="白巧克力"
        ></div>
        <div
          class="tool-btn"
          style="background-color: #ffb7c5"
          data-tool="chocolate"
          data-color="#ffb7c5"
          title="草莓巧克力"
        ></div>
        <div
          class="tool-btn sprinkle-bar-btn"
          data-tool="sprinkle-bar"
          title="彩色糖果棒"
        >
          ✧
        </div>
        <div
          class="tool-btn sprinkle-heart-btn"
          data-tool="sprinkle-heart"
          title="粉色愛心糖粒"
        >
          ♥
        </div>
        <div
          class="tool-btn sprinkle-star-btn"
          data-tool="sprinkle-star"
          title="白色星星糖粒"
        >
          ★
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // 觸控裝置（手機、平板）判斷，用來切換提示文字
      const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
      const DRAW_HINT = isTouchDevice
        ? "單指畫畫，雙指旋轉／縮放 🎀"
        : "左鍵畫畫，右鍵旋轉視角 🎀";
      const EAT_HINT = isTouchDevice
        ? "對著鏡頭「啊～」張大嘴巴吃掉它！😋<br><small>（或點一下巧克力）</small>"
        : "對著螢幕「啊～」張大嘴巴吃掉它！😋<br><small>（或點一下巧克力）</small>";
      const infoEl = document.getElementById("info");
      infoEl.innerHTML = DRAW_HINT;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      // 手機螢幕像素密度很高，限制在 2 倍以內避免太耗電、太卡
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      const canvas = renderer.domElement;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 8;
      controls.maxDistance = 60;
      controls.maxPolarAngle = Math.PI / 2 - 0.1;
      controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE,
      };
      // 觸控：單指留給畫畫，雙指旋轉 + 縮放
      controls.touches = {
        ONE: null,
        TWO: THREE.TOUCH.DOLLY_ROTATE,
      };
      window.addEventListener("contextmenu", (e) => e.preventDefault());

      // ==========================================
      // 📱 依螢幕比例自動調整鏡頭距離（直式手機會拉遠，巧克力才不會被切掉）
      // ==========================================
      const DRAW_VIEW = new THREE.Vector3(0, 12, 12);
      const EAT_VIEW = new THREE.Vector3(0, 5, 15);
      const FIT_RADIUS = 6.5; // 巧克力加錫箔杯大約的半徑，多留一點邊

      function minFitDistance() {
        const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
        const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
        return FIT_RADIUS / Math.sin(Math.min(halfV, halfH));
      }
      function setView(base) {
        const dist = Math.max(base.length(), minFitDistance());
        camera.position.copy(base).setLength(dist);
        controls.target.set(0, 0, 0);
        controls.update();
      }
      setView(DRAW_VIEW);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 50;
      dirLight.shadow.bias = -0.001;
      scene.add(dirLight);

      const masterGroup = new THREE.Group();
      scene.add(masterGroup);

      // ==========================================
      // 🌟 核心魔法：真實 3D 咬痕 Shader (著色器)
      // ==========================================
      // 預設五個咬痕的空間座標(x,y,z)與半徑(w)
      const biteUniforms = {
        biteData: {
          value: [
            new THREE.Vector4(3.5, 0.5, 3.5, 3.5), // 右上角咬一口
            new THREE.Vector4(-3.5, 0.5, 3.5, 3.5), // 左上角咬一口
            new THREE.Vector4(3.5, 0.5, -3.5, 3.5), // 右下角咬一口
            new THREE.Vector4(-3.5, 0.5, -3.5, 3.5), // 左下角咬一口
            new THREE.Vector4(0.0, 0.0, 0.0, 8.0), // 最後一口全部吃光
          ],
        },
        numBites: { value: 0 },
      };

      // 這個函數會對所有材質施法，讓它們遇到「咬痕」範圍時自動消失
      function patchMaterialForBites(mat) {
        mat.side = THREE.DoubleSide; // 雙面渲染，讓咬開的地方看起來是空心巧克力殼
        mat.onBeforeCompile = (shader) => {
          shader.uniforms.biteData = biteUniforms.biteData;
          shader.uniforms.numBites = biteUniforms.numBites;

          shader.vertexShader =
            `
                    varying vec3 vWorldPosBite;
                ` + shader.vertexShader;

          shader.vertexShader = shader.vertexShader.replace(
            "#include <worldpos_vertex>",
            `
                    #include <worldpos_vertex>
                    vWorldPosBite = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    `,
          );

          shader.fragmentShader =
            `
                    uniform vec4 biteData[5];
                    uniform int numBites;
                    varying vec3 vWorldPosBite;
                ` + shader.fragmentShader;

          // 如果像素在咬痕球體的半徑內，就丟棄它 (discard)
          shader.fragmentShader = shader.fragmentShader.replace(
            "void main() {",
            `
                    void main() {
                        for(int i=0; i<5; i++) {
                            if(i >= numBites) break;
                            if(distance(vWorldPosBite, biteData[i].xyz) < biteData[i].w) {
                                discard;
                            }
                        }
                    `,
          );
        };
        mat.needsUpdate = true;
      }

      // ==========================================
      // 材質與模型設定
      // ==========================================
      const baseMat = new THREE.MeshStandardMaterial({
        color: "#3d1c04",
        roughness: 0.4,
      });
      const foilMat = new THREE.MeshStandardMaterial({
        color: "#e8e8e8",
        metalness: 0.9,
        roughness: 0.4,
      });
      const frostingMaterials = {
        "#4a2e15": new THREE.MeshPhongMaterial({
          color: "#4a2e15",
          shininess: 15,
          specular: 0x222222,
        }),
        "#fffdd0": new THREE.MeshPhongMaterial({
          color: "#fffdd0",
          shininess: 20,
          specular: 0x888888,
        }),
        "#ffb7c5": new THREE.MeshPhongMaterial({
          color: "#ffb7c5",
          shininess: 20,
          specular: 0x888888,
        }),
      };
      const starMat = new THREE.MeshPhongMaterial({
        color: "#fffdd0",
        shininess: 10,
        specular: 0xaaaaaa,
      });
      const heartMat = new THREE.MeshPhongMaterial({
        color: "#ff85a1",
        shininess: 10,
        specular: 0xaaaaaa,
      });
      const barSprinkleColors = [
        "#ffb3ba",
        "#ffdfba",
        "#baffc9",
        "#bae1ff",
        "#e0baff",
        "#ffffff",
      ];
      const barSprinkleMats = barSprinkleColors.map(
        (c) =>
          new THREE.MeshPhongMaterial({
            color: c,
            shininess: 10,
            specular: 0xaaaaaa,
          }),
      );

      // 🌟 將所有的材質套上咬痕魔法
      const allMats = [
        baseMat,
        foilMat,
        starMat,
        heartMat,
        ...barSprinkleMats,
        ...Object.values(frostingMaterials),
      ];
      allMats.forEach(patchMaterialForBites);

      // 建置基底與紙杯
      const baseGeo = new THREE.CylinderGeometry(4.8, 4.8, 1.5, 64);
      const baseChocolate = new THREE.Mesh(baseGeo, baseMat);
      baseChocolate.receiveShadow = true;
      baseChocolate.castShadow = true;
      masterGroup.add(baseChocolate);

      const foilGroup = new THREE.Group();
      const cupGeo = new THREE.CylinderGeometry(5.5, 4.85, 1.7, 128, 1, true);
      const pos = cupGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const angle = Math.atan2(v.z, v.x);
        const crinkle = Math.sin(angle * 45) * 0.15;
        const crinkleIntensity = 0.1 + 0.9 * ((v.y + 0.85) / 1.7);
        const radius = Math.sqrt(v.x * v.x + v.z * v.z);
        const factor = 1 + (crinkle / radius) * crinkleIntensity;
        v.x *= factor;
        v.z *= factor;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      cupGeo.computeVertexNormals();
      const bottomGeo = new THREE.CircleGeometry(4.85, 128);
      bottomGeo.rotateX(-Math.PI / 2);
      bottomGeo.translate(0, -0.85, 0);
      const cupMesh = new THREE.Mesh(cupGeo, foilMat);
      const bottomMesh = new THREE.Mesh(bottomGeo, foilMat);
      cupMesh.castShadow = true;
      cupMesh.receiveShadow = true;
      bottomMesh.receiveShadow = true;
      foilGroup.add(cupMesh);
      foilGroup.add(bottomMesh);
      foilGroup.position.y = 0.09;
      masterGroup.add(foilGroup);

      const chocolateGroup = new THREE.Group();
      masterGroup.add(chocolateGroup);
      const sprinkleGroup = new THREE.Group();
      masterGroup.add(sprinkleGroup);

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      const sprinkleExtrudeSettings = {
        depth: 0.04,
        bevelEnabled: true,
        bevelThickness: 0.01,
        bevelSize: 0.01,
        bevelSegments: 3,
      };

      function createStarGeometry() {
        const shape = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const radius = i % 2 === 0 ? 0.4 : 0.16;
          const angle = (i / 10) * Math.PI * 2;
          if (i === 0)
            shape.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
          else shape.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        shape.closePath();
        const geo = new THREE.ExtrudeGeometry(shape, sprinkleExtrudeSettings);
        geo.computeBoundingBox();
        const center = new THREE.Vector3();
        geo.boundingBox.getCenter(center);
        geo.translate(-center.x, -center.y, -center.z);
        return geo;
      }
      const starGeo = createStarGeometry();

      function createHeartGeometry() {
        const heartShape = new THREE.Shape();
        const pts = [];
        for (let i = 0; i < 64; i++) {
          const t = (i / 64) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);
          pts.push(new THREE.Vector2(x / 40, y / 40));
        }
        heartShape.setFromPoints(pts);
        const geo = new THREE.ExtrudeGeometry(
          heartShape,
          sprinkleExtrudeSettings,
        );
        geo.scale(1.05, 1.05, 1);
        geo.computeBoundingBox();
        const center = new THREE.Vector3();
        geo.boundingBox.getCenter(center);
        geo.translate(-center.x, -center.y, -center.z);
        return geo;
      }
      const heartGeo = createHeartGeometry();
      const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);

      let isDrawing = false;
      let currentTool = "chocolate";
      let currentColor = "#4a2e15";
      let currentPoints = [];
      let currentLineMesh = null;
      let TUBE_RADIUS = parseFloat(
        document.getElementById("size-slider").value,
      );
      const MIN_DISTANCE_CHOCOLATE = 0.08;

      let capGeo = new THREE.SphereGeometry(TUBE_RADIUS, 16, 16);
      let currentStartCap = null;
      let currentEndCap = null;
      let actionHistory = [];
      let currentActionMeshes = [];

      // 狀態變數
      let isEatMode = false;
      let bitesTaken = 0;
      let isMouthCurrentlyOpen = false;

      document.getElementById("size-slider").addEventListener("input", (e) => {
        TUBE_RADIUS = parseFloat(e.target.value);
        capGeo.dispose();
        capGeo = new THREE.SphereGeometry(TUBE_RADIUS, 16, 16);
      });

      function getIntersectData(event) {
        if (isEatMode) return null; // 咬咬模式禁止畫畫
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const targets = [baseChocolate, ...chocolateGroup.children];
        const intersects = raycaster.intersectObjects(targets, false);
        if (intersects.length > 0) {
          const validHit = intersects.find(
            (hit) => !currentActionMeshes.includes(hit.object),
          );
          if (validHit)
            return { point: validHit.point, normal: validHit.face.normal };
        }
        return null;
      }

      function scatterSprinkles(hitData) {
        const isBar = currentTool === "sprinkle-bar";
        const count = isBar ? Math.floor(Math.random() * 3) + 2 : 1;
        const spread = isBar ? 0.6 : 0.3;
        const safeDistance = isBar ? 0.15 : 0.4;

        for (let i = 0; i < count; i++) {
          let proposedPos = hitData.point.clone();
          proposedPos.x += (Math.random() - 0.5) * spread;
          proposedPos.z += (Math.random() - 0.5) * spread;
          let pushThickness = isBar ? 0.08 : (0.04 + 0.01 * 2) / 2;
          proposedPos.add(
            hitData.normal.clone().multiplyScalar(pushThickness * 0.95),
          );

          let isOverlapping = false;
          for (let j = 0; j < sprinkleGroup.children.length; j++) {
            if (
              sprinkleGroup.children[j].position.distanceTo(proposedPos) <
              safeDistance
            ) {
              isOverlapping = true;
              break;
            }
          }
          if (isOverlapping) continue;

          let sprinkle;
          if (isBar)
            sprinkle = new THREE.Mesh(
              barGeo,
              barSprinkleMats[
                Math.floor(Math.random() * barSprinkleMats.length)
              ],
            );
          else if (currentTool === "sprinkle-heart")
            sprinkle = new THREE.Mesh(heartGeo, heartMat);
          else if (currentTool === "sprinkle-star")
            sprinkle = new THREE.Mesh(starGeo, starMat);

          if (!sprinkle) return;

          sprinkle.position.copy(proposedPos);
          sprinkle.lookAt(sprinkle.position.clone().add(hitData.normal));
          if (isBar) sprinkle.rotateX(Math.PI / 2);
          sprinkle.rotateZ(Math.random() * Math.PI * 2);
          sprinkle.castShadow = true;
          sprinkle.receiveShadow = false;
          sprinkleGroup.add(sprinkle);
          currentActionMeshes.push(sprinkle);
        }
      }

      function startDrawing(event) {
        if (isEatMode) return;
        const hitData = getIntersectData(event);
        if (hitData) {
          isDrawing = true;
          currentActionMeshes = [];
          if (currentTool.startsWith("sprinkle")) {
            currentPoints = [hitData.point.clone()];
            scatterSprinkles(hitData);
            return;
          }
          const point = hitData.point.clone();
          point.add(hitData.normal.clone().multiplyScalar(TUBE_RADIUS * 0.8));
          const offsetPoint = point
            .clone()
            .add(new THREE.Vector3(0.005, 0, 0.005));
          currentPoints = [point, offsetPoint];
          const curve = new THREE.CatmullRomCurve3(
            currentPoints,
            false,
            "centripetal",
            0.5,
          );
          const geometry = new THREE.TubeGeometry(
            curve,
            16,
            TUBE_RADIUS,
            12,
            false,
          );
          currentLineMesh = new THREE.Mesh(
            geometry,
            frostingMaterials[currentColor],
          );
          currentLineMesh.castShadow = true;
          currentLineMesh.receiveShadow = false;
          chocolateGroup.add(currentLineMesh);
          currentActionMeshes.push(currentLineMesh);
          currentStartCap = new THREE.Mesh(
            capGeo,
            frostingMaterials[currentColor],
          );
          currentStartCap.position.copy(point);
          currentStartCap.castShadow = true;
          currentStartCap.receiveShadow = false;
          chocolateGroup.add(currentStartCap);
          currentActionMeshes.push(currentStartCap);
          currentEndCap = new THREE.Mesh(
            capGeo,
            frostingMaterials[currentColor],
          );
          currentEndCap.position.copy(offsetPoint);
          currentEndCap.castShadow = true;
          currentEndCap.receiveShadow = false;
          chocolateGroup.add(currentEndCap);
          currentActionMeshes.push(currentEndCap);
        }
      }

      function draw(event) {
        if (!isDrawing || isEatMode) return;
        if (event.pointerType === "mouse" && (event.buttons & 1) === 0) return;
        const hitData = getIntersectData(event);
        if (hitData) {
          const point = hitData.point.clone();
          point.add(hitData.normal.clone().multiplyScalar(TUBE_RADIUS * 0.8));
          const lastPoint = currentPoints[currentPoints.length - 1];
          if (currentTool.startsWith("sprinkle")) {
            const isBar = currentTool === "sprinkle-bar";
            const distReq = isBar ? 0.04 : 0.15,
              probReq = isBar ? 0.1 : 0.6;
            if (
              lastPoint.distanceTo(point) > distReq &&
              Math.random() > probReq
            ) {
              currentPoints.push(point);
              scatterSprinkles(hitData);
            }
            return;
          }
          if (!currentLineMesh) return;
          if (lastPoint.distanceTo(point) > MIN_DISTANCE_CHOCOLATE) {
            currentPoints.push(point);
            const jointCap = new THREE.Mesh(
              capGeo,
              frostingMaterials[currentColor],
            );
            jointCap.position.copy(point);
            jointCap.castShadow = true;
            jointCap.receiveShadow = false;
            chocolateGroup.add(jointCap);
            currentActionMeshes.push(jointCap);
            const curve = new THREE.CatmullRomCurve3(
              currentPoints,
              false,
              "centripetal",
              0.5,
            );
            const tubularSegments = Math.max(24, currentPoints.length * 6);
            const newGeometry = new THREE.TubeGeometry(
              curve,
              tubularSegments,
              TUBE_RADIUS,
              12,
              false,
            );
            currentLineMesh.geometry.dispose();
            currentLineMesh.geometry = newGeometry;
            if (currentEndCap) currentEndCap.position.copy(point);
          }
        }
      }

      function resetStrokeState() {
        isDrawing = false;
        currentLineMesh = null;
        currentPoints = [];
        currentStartCap = null;
        currentEndCap = null;
        currentActionMeshes = [];
      }

      function stopDrawing() {
        if (isDrawing && currentActionMeshes.length > 0)
          actionHistory.push(currentActionMeshes);
        resetStrokeState();
      }

      // 第二根手指放上來 = 想旋轉視角，把剛剛不小心畫出的那一筆收回
      function cancelStroke() {
        if (!isDrawing) return;
        if (currentLineMesh) currentLineMesh.geometry.dispose();
        currentActionMeshes.forEach((mesh) => {
          if (mesh.parent) mesh.parent.remove(mesh);
        });
        resetStrokeState();
      }

      // ==========================================
      // 📱 統一用 Pointer Events 處理滑鼠與觸控
      // ==========================================
      const activePointers = new Set();
      let drawingPointerId = null;

      canvas.addEventListener("pointerdown", (e) => {
        activePointers.add(e.pointerId);

        if (isEatMode) {
          // 吃吃模式：點一下也能咬（沒有鏡頭權限時的備案）
          if (activePointers.size === 1 && e.button === 0) takeABite();
          return;
        }

        if (activePointers.size > 1) {
          cancelStroke();
          drawingPointerId = null;
          return;
        }
        if (e.button !== 0) return;
        startDrawing(e);
        if (isDrawing) drawingPointerId = e.pointerId;
      });

      canvas.addEventListener("pointermove", (e) => {
        if (e.pointerId !== drawingPointerId) return;
        // 高頻率觸控裝置會把多個點合併，逐一處理讓線條更順
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        if (events.length > 1) events.forEach((ce) => draw(ce));
        else draw(e);
      });

      const endPointer = (e) => {
        activePointers.delete(e.pointerId);
        if (e.pointerId === drawingPointerId) {
          stopDrawing();
          drawingPointerId = null;
        }
      };
      window.addEventListener("pointerup", endPointer);
      window.addEventListener("pointercancel", endPointer);

      const buttons = document.querySelectorAll(".tool-btn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          buttons.forEach((b) => b.classList.remove("active"));
          const target = e.target.closest(".tool-btn");
          target.classList.add("active");
          currentTool = target.dataset.tool;
          if (currentTool === "chocolate") currentColor = target.dataset.color;
        });
      });

      document.getElementById("undo-btn").addEventListener("click", () => {
        if (actionHistory.length === 0) return;
        const lastAction = actionHistory.pop();
        lastAction.forEach((mesh) => {
          if (mesh.geometry && mesh.geometry.type === "TubeGeometry")
            mesh.geometry.dispose();
          if (mesh.parent) mesh.parent.remove(mesh);
        });
      });

      document.getElementById("clear-btn").addEventListener("click", () => {
        [chocolateGroup, sprinkleGroup].forEach((group) => {
          for (let i = group.children.length - 1; i >= 0; i--) {
            const child = group.children[i];
            if (child.geometry && child.geometry.type === "TubeGeometry")
              child.geometry.dispose();
            group.remove(child);
          }
        });
        actionHistory = [];
        // 🌟 重置咬痕與狀態
        bitesTaken = 0;
        biteUniforms.numBites.value = 0;
        masterGroup.visible = true;
        masterGroup.position.set(0, 0, 0);
        masterGroup.rotation.set(0, 0, 0);
        document.getElementById("oishii-msg").style.display = "none";
        infoEl.innerHTML = isEatMode ? EAT_HINT : DRAW_HINT;
        // 恢復陰影
        masterGroup.traverse((child) => {
          if (child.isMesh) child.castShadow = true;
        });
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        // 轉向或視窗變窄時，確保巧克力還完整在畫面內
        const need = Math.max(minFitDistance(), controls.minDistance);
        const offset = camera.position.clone().sub(controls.target);
        if (offset.length() < need) {
          offset.setLength(need);
          camera.position.copy(controls.target).add(offset);
        }
        controls.maxDistance = Math.max(60, need * 1.5);
      });
      window.dispatchEvent(new Event("resize"));

      // ==========================================
      // 🌟 隱藏攝影機與張嘴吃掉特效邏輯
      // ==========================================
      const videoElement = document.getElementById("webcam-video");
      const eatBtn = document.getElementById("eat-btn");
      let faceMesh;
      let cameraInit = false;

      function initCamera() {
        cameraInit = true;
        if (!navigator.mediaDevices || !window.isSecureContext) {
          infoEl.innerHTML =
            "這個網址開不了鏡頭（需要 https）<br><small>點一下巧克力來吃吧！😋</small>";
          return;
        }
        try {
          faceMesh = new FaceMesh({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
          });
          faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
          faceMesh.onResults(onFaceResults);

          const cam = new Camera(videoElement, {
            onFrame: async () => {
              if (isEatMode) await faceMesh.send({ image: videoElement });
            },
            width: 320,
            height: 240,
            facingMode: "user", // 手機用前鏡頭
          });
          cam.start().catch(() => {
            infoEl.innerHTML =
              "沒有拿到鏡頭權限<br><small>點一下巧克力來吃吧！😋</small>";
          });
        } catch (err) {
          infoEl.innerHTML =
            "鏡頭啟動失敗<br><small>點一下巧克力來吃吧！😋</small>";
        }
      }

      function takeABite() {
        if (bitesTaken >= 5) return;
        bitesTaken++;

        // 手機上給一點震動回饋（有支援的裝置才會震）
        if (navigator.vibrate) navigator.vibrate(40);

        // 🌟 觸發 Shader 的咬痕效果！
        biteUniforms.numBites.value = bitesTaken;

        // 讓巧克力震動一下，並稍微往下沉，模擬被咬的力量
        masterGroup.position.y -= 0.1;
        masterGroup.rotation.y += (Math.random() - 0.5) * 0.4;
        masterGroup.rotation.z += (Math.random() - 0.5) * 0.2;

        // 關閉陰影，避免咬掉的地方殘留奇怪的空氣陰影
        masterGroup.traverse((child) => {
          if (child.isMesh) child.castShadow = false;
        });

        if (bitesTaken >= 5) {
          masterGroup.visible = false;
          document.getElementById("oishii-msg").style.display = "block";
          infoEl.innerHTML = "按「もう1コ作る ↺」再來一顆！🎀";
        }
      }

      function onFaceResults(results) {
        if (!isEatMode) return;
        if (
          results.multiFaceLandmarks &&
          results.multiFaceLandmarks.length > 0
        ) {
          const landmarks = results.multiFaceLandmarks[0];
          const topLip = landmarks[13];
          const bottomLip = landmarks[14];
          const forehead = landmarks[10];
          const chin = landmarks[152];

          // 嘴巴張開的程度，用臉的高度來換算比例
          // 這樣手機拿近拿遠都一樣好判斷
          const faceHeight = Math.abs(chin.y - forehead.y) || 1;
          const mouthRatio = Math.abs(topLip.y - bottomLip.y) / faceHeight;
          const OPEN = 0.1;
          const CLOSE = 0.07;

          if (mouthRatio > OPEN && !isMouthCurrentlyOpen) {
            isMouthCurrentlyOpen = true;
            takeABite();
          } else if (mouthRatio < CLOSE) {
            isMouthCurrentlyOpen = false;
          }
        }
      }

      eatBtn.addEventListener("click", () => {
        isEatMode = !isEatMode;
        cancelStroke();
        if (isEatMode) {
          infoEl.innerHTML = EAT_HINT;
          eatBtn.innerHTML = "畫畫モード 🖌️";
          setView(EAT_VIEW);
          if (!cameraInit) initCamera();
        } else {
          infoEl.innerHTML = DRAW_HINT;
          eatBtn.innerHTML = "食べる！📸";
          setView(DRAW_VIEW);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
